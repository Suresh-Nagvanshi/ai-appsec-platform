# Alembic configuration file
# Reference: https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to the migration scripts directory (relative to this file)
script_location = backend/db/migrations

# Template for revision file names
file_template = %%(rev)s_%%(slug)s

# Truncate slug at this many characters
truncate_slug_length = 40

# Timezone for revision timestamps — use UTC to avoid ambiguity
timezone = UTC

# --- SQLAlchemy URL ---
# The env.py file reads DATABASE_URL from the .env file at runtime,
# so this value is only used if env.py cannot find the env var.
# Override via: alembic -x DATABASE_URL=postgresql+psycopg://... upgrade head
sqlalchemy.url = postgresql+psycopg://user:password@localhost/appsec

[post_write_hooks]
# Run Black on every generated migration file (optional, requires black)
# hooks = black
# black.type = console_scripts
# black.entrypoint = black

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
